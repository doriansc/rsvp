<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odjava s događaja</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f5f7;
            color: #1a1a1a;
        }
        .container {
            text-align: center;
            padding: 60px 48px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            max-width: 520px;
            width: 90%;
            border-top: 4px solid #757575;
        }
        .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 28px;
            background: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg {
            width: 28px;
            height: 28px;
            stroke: #757575;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a1a1a;
        }
        p {
            font-size: 16px;
            color: #555;
            line-height: 1.7;
        }
        .divider {
            width: 48px;
            height: 1px;
            background: #ddd;
            margin: 24px auto;
        }
        .footer {
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
        <h1>Vaša odjava je zabilježena</h1>
        <p>Zahvaljujemo na povratnoj informaciji. Žao nam je što niste u mogućnosti prisustvovati. Nadamo se Vašem dolasku na neki od budućih događaja.</p>
        <div class="divider"></div>
        <p class="footer">Ovu stranicu možete zatvoriti.</p>
    </div>
</body>
</html>
